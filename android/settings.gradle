pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
def configuredNodeBinary = providers.gradleProperty("NODE_BINARY").orNull ?: System.getenv("NODE_BINARY") ?: "node"
def reactNativeCli = new File(rootDir, "../node_modules/@react-native-community/cli/build/bin.js").absolutePath
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand([configuredNodeBinary, reactNativeCli, "config"])
}
rootProject.name = 'HealthsoftApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
